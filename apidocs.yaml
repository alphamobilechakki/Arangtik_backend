openapi: "3.0.3"
info:
  title: Arangtik Backend API Documentation
  version: "1.0.0"
  description: "Comprehensive OpenAPI 3.0.3 specification for Arangtik — AI-Powered Wardrobe, Laundry, Frequent Connect Collaborative Ecosystem, Hardware IoT Hubs, and Household Management platform."
  contact:
    name: Arangtik Core API Team
    url: "https://api.arangtik.com"
    email: "api@arangtik.com"
servers:
  - url: "http://localhost:8083/api"
    description: Local Development Server
  - url: "https://api.arangtik.com/api"
    description: Production API Server
tags:
  - name: "Health & System"
    description: System health probes and telemetry
  - name: "Authentication & Profile"
    description: "User OTP login, registration, JWT tokens, profile & biometric face photo registration"
  - name: Wardrobe Management
    description: "Closet containers, photo garment ingestion, classification, visual duplicate detection, and clothing items"
  - name: Vendor Management
    description: "Vendor onboarding, verification, service offerings, 2dsphere geolocation discovery, and assigned work orders"
  - name: Hardware IoT Hubs
    description: Smart IoT Hub hardware activation and binding
  - name: Hardware KitchenBoxes
    description: Smart IoT KitchenBox hardware activation and remote sensor triggers
  - name: "Orders & Laundry"
    description: "Universal service work orders, multi-owner cluster laundry dispatch, WhatsApp dispatch, and status lifecycle"
  - name: "Smart & Collaborative Outfit Styling"
    description: "AI occasion outfit suggestion, dual-identity attributed collaborative styling (Styled by Priya), wear-tracking, and status workflow"
  - name: "Subscription & Razorpay Payments"
    description: "Subscription tiers, recurring auto-pay, Razorpay payment orders, and admin subscription management"
  - name: "Coins & Virtual Currency"
    description: "Coin balances, package purchasing, virtual wallet deductions, and admin virtual package management"
  - name: "Frequent Connect (Clusters & Messaging)"
    description: "One-tap communication clusters, member management, text & voice chat, 15-min auto-delete, and cluster wardrobe discovery hub"
  - name: Admin Cluster Features Master
    description: "Catalog management for dynamic cluster capabilities (WARDROBE, LAUNDRY, WALKIE_TALKIE)"
  - name: Admin Frequent Connect Telemetry
    description: "Admin monitoring, cluster analytics, and immutable audit logs"
  - name: "Admin Density Categories & Products"
    description: Density categories and consumable household products
  - name: Notifications
    description: User FCM push notifications and read status updates
  - name: "Store Types & Public Taxonomies"
    description: "Store types, level-1 service categories, and public service catalogues"
paths:
  "/health":
    get:
      tags:
        - "Health & System"
      summary: Global API Health Probe
      description: Checks operational status of the core Express application.
      responses:
        200:
          description: API is healthy
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
  "/fc/health":
    get:
      tags:
        - "Health & System"
      summary: Frequent Connect Subsystem Health Probe
      description: Checks operational status of the Frequent Connect routing engine.
      responses:
        200:
          description: Frequent Connect is healthy
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      feature:
                        type: string
                        example: Frequent Connect
  "/auth/send-otp":
    post:
      tags:
        - "Authentication & Profile"
      summary: "Send 6-Digit OTP"
      description: Dispatches OTP to registered or new mobile phone number via SMS gateway.
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "9876543210"
      responses:
        200:
          description: OTP dispatched
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: OTP sent successfully
        400:
          description: "Valid 10-digit phone number is required"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Valid 10-digit phone number is required"
                  errors:
                    type: array
                    items:
                      type: string
  "/auth/verify-otp":
    post:
      tags:
        - "Authentication & Profile"
      summary: "Verify OTP & Login / Register"
      description: "Validates 6-digit OTP code, provisions new account if first-time user, and returns signed JWT access token."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "9876543210"
                otp:
                  type: string
                  example: "123456"
                name:
                  type: string
                  example: Priya Sharma
      responses:
        200:
          description: OTP verified successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/AuthResponse"
        400:
          description: Invalid or expired OTP
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid or expired OTP
                  errors:
                    type: array
                    items:
                      type: string
  "/auth/profile":
    get:
      tags:
        - "Authentication & Profile"
      summary: Get Current Authenticated User Profile
      security:
        - BearerAuth: []
      responses:
        200:
          description: User profile retrieved
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/UserProfile"
        401:
          description: "Unauthorized access, token missing or invalid"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 401
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthorized access, token missing or invalid"
                  errors:
                    type: array
                    items:
                      type: string
    patch:
      tags:
        - "Authentication & Profile"
      summary: Update Profile Attributes
      security:
        - BearerAuth: []
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Priya Sharma
                email:
                  type: string
                  example: "priya@example.com"
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - OTHER
                  example: FEMALE
                profileImage:
                  type: string
                  example: "https://api.arangtik.com/uploads/priya.jpg"
      responses:
        200:
          description: Profile updated successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/UserProfile"
        400:
          description: Validation error
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: string
  "/auth/profile-image":
    post:
      tags:
        - "Authentication & Profile"
      summary: "Upload Profile Image & Biometric Reference Face"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        200:
          description: Profile image uploaded and face analyzed
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/UserProfile"
  "/auth/fcm-token":
    post:
      tags:
        - "Authentication & Profile"
      summary: Register FCM Device Push Token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: dKz7...fcm_token_here
                platform:
                  type: string
                  enum:
                    - ANDROID
                    - IOS
                    - WEB
                    - OTHER
                  example: ANDROID
                deviceId:
                  type: string
                  example: samsung_sm_g998b
      responses:
        200:
          description: Device token registered successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
    delete:
      tags:
        - "Authentication & Profile"
      summary: Remove FCM Device Push Token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: dKz7...fcm_token_here
      responses:
        200:
          description: Device token removed successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
  "/auth/logout":
    post:
      tags:
        - "Authentication & Profile"
      summary: Logout User
      security:
        - BearerAuth: []
      responses:
        200:
          description: Logged out successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
  "/wardrobe/create-wardrobe":
    post:
      tags:
        - Wardrobe Management
      summary: Create Wardrobe Closet Container
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Daily Casuals
                storeTypeId:
                  type: string
                  example: 6ae03a499b2993a9455fc54f
                type:
                  type: string
                  enum:
                    - PERSONAL
                    - SHARED
                    - FAMILY
                  example: PERSONAL
                ownerName:
                  type: string
                  example: Monika
                isDefault:
                  type: boolean
                  example: true
                coverImage:
                  type: string
                  format: binary
                ownerFaceImage:
                  type: string
                  format: binary
          "application/json":
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Daily Casuals
                storeTypeId:
                  type: string
                  example: 6ae03a499b2993a9455fc54f
                type:
                  type: string
                  example: PERSONAL
                ownerName:
                  type: string
                  example: Monika
                isDefault:
                  type: boolean
                  example: false
      responses:
        201:
          description: Wardrobe closet created successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeContainer"
        400:
          description: Wardrobe name is required
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Wardrobe name is required
                  errors:
                    type: array
                    items:
                      type: string
  "/wardrobe/get-wardrobes":
    get:
      tags:
        - Wardrobe Management
      summary: "Get All Wardrobes / Stores"
      description: Lists all active wardrobe containers for user or across a shared cluster when clusterId is specified.
      security:
        - BearerAuth: []
      parameters:
        - name: storeTypeId
          in: query
          schema:
            type: string
          description: Filter by store type ObjectId
        - name: storeType
          in: query
          schema:
            type: string
          description: Filter by code (e.g. WARDROBE) or ALL
        - name: clusterId
          in: query
          schema:
            type: string
          description: Discover wardrobes across all active members of the specified cluster
        - name: ownerId
          in: query
          schema:
            type: string
          description: Target specific cluster member wardrobe
        - name: includeDeleted
          in: query
          schema:
            type: boolean
          description: "Include soft-deleted containers"
      responses:
        200:
          description: Wardrobes fetched successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WardrobeContainer"
  "/wardrobe/get-wardrobe/{id}":
    get:
      tags:
        - Wardrobe Management
      summary: Get Single Wardrobe Container
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Wardrobe container retrieved
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeContainer"
        403:
          description: "Permission denied: No shared cluster with WARDROBE feature"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 403
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Permission denied: No shared cluster with WARDROBE feature"
                  errors:
                    type: array
                    items:
                      type: string
        404:
          description: Wardrobe container not found
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Wardrobe container not found
                  errors:
                    type: array
                    items:
                      type: string
  "/wardrobe/update-wardrobe/{id}":
    patch:
      tags:
        - Wardrobe Management
      summary: Update Wardrobe Container Attributes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Office & Work Wear"
                type:
                  type: string
                  example: PERSONAL
                isDefault:
                  type: boolean
                  example: false
      responses:
        200:
          description: Wardrobe container updated
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeContainer"
  "/wardrobe/delete-wardrobe/{id}":
    delete:
      tags:
        - Wardrobe Management
      summary: Delete Wardrobe Container (Soft Delete by default)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hard
          in: query
          schema:
            type: boolean
          description: Pass true for hard deletion
      responses:
        200:
          description: Wardrobe container deleted successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
  "/wardrobe/restore-wardrobe/{id}":
    patch:
      tags:
        - Wardrobe Management
      summary: "Restore Soft-Deleted Wardrobe Container"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Wardrobe container restored
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeContainer"
  "/wardrobe/add-item":
    post:
      tags:
        - Wardrobe Management
      summary: "Upload Clothing Item Photo & Process with AI"
      description: "Single or batch photo upload. Performs AI image segmentation, perceptual duplicate detection, and visual taxonomy classification."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                wardrobeId:
                  type: string
                  example: 6ae0551433480f1d0fb8d9e2
                name:
                  type: string
                  example: Navy Blue Silk Kurta
                category:
                  type: string
                  example: Kurtas
                color:
                  type: string
                  example: Navy Blue
                forceAdd:
                  type: boolean
                  example: false
      responses:
        200:
          description: Exact or visual duplicate detected and matched
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeItem"
        201:
          description: Wardrobe item added successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeItem"
  "/wardrobe/get-items":
    get:
      tags:
        - Wardrobe Management
      summary: "Get Clothes / Garments with Filters & Pagination"
      description: "Fetches clothes filtered by category, color, season, wardrobe, or shared cluster."
      security:
        - BearerAuth: []
      parameters:
        - name: clusterId
          in: query
          schema:
            type: string
          description: Query items across all members of that cluster
        - name: ownerId
          in: query
          schema:
            type: string
          description: Query items belonging to specific cluster member
        - name: wardrobeId
          in: query
          schema:
            type: string
          description: Filter by specific wardrobe container ID
        - name: category
          in: query
          schema:
            type: string
        - name: subCategory
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: occasion
          in: query
          schema:
            type: string
        - name: season
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: "-createdAt"
      responses:
        200:
          description: Items retrieved successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/WardrobeItem"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
  "/wardrobe/get-item/{id}":
    get:
      tags:
        - Wardrobe Management
      summary: Get Item Details by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Item retrieved successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeItem"
        404:
          description: Wardrobe item not found
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Wardrobe item not found
                  errors:
                    type: array
                    items:
                      type: string
  "/wardrobe/edit-item/{id}":
    patch:
      tags:
        - Wardrobe Management
      summary: "Update Garment Details & Organizing Location"
      description: "Allows owner or cluster member (with WARDROBE enabled) to update item details, storage location, or move to another closet. Sets lastModifiedBy."
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Slim Fit Navy Chinos
                wardrobeId:
                  type: string
                  example: 6ae0551433480f1d0fb8d9e2
                category:
                  type: string
                  example: Pants
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                  example: ACTIVE
      responses:
        200:
          description: Garment updated successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/WardrobeItem"
  "/wardrobe/delete-item/{id}":
    delete:
      tags:
        - Wardrobe Management
      summary: Delete Clothing Item
      description: Permanently deletes a clothing item. Strictly restricted to garment owner.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Garment deleted
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
