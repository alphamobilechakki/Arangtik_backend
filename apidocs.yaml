    post:
      tags:
        - "Smart & Collaborative Outfit Styling"
      summary: "Save Outfit / Collaborative Styling"
      description: "Saves outfit to closet collection. If targetUserId is another member, validates shared cluster access with WARDROBE enabled, attributes createdBy vs targetUserId, sets status=SUGGESTED, and sends FCM push notification."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - title
                - occasion
                - items
              properties:
                targetUserId:
                  type: string
                  example: 6735fa016ba477c7d42cfb82
                  description: Recipient user ID (if styling for another member)
                clusterId:
                  type: string
                  example: 6735fa016ba477c7d42cfb80
                  description: Cluster context ID
                title:
                  type: string
                  example: Friday Office Casual
                occasion:
                  type: string
                  example: CASUAL
                season:
                  type: string
                  default: ALL_SEASON
                  example: ALL_SEASON
                stylingNotes:
                  type: string
                  example: Wear with white sneakers
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - itemId
                      - slot
                    properties:
                      itemId:
                        type: string
                        example: 6ae0601433480f1d0fb8d9f1
                      slot:
                        type: string
                        enum:
                          - UPPER_WEAR
                          - LOWER_WEAR
                          - ONE_PIECE
                          - OUTERWEAR
                          - FOOTWEAR
                          - ACCESSORIES
                        example: UPPER_WEAR
                      name:
                        type: string
                        example: Linen White Shirt
      responses:
        201:
          description: Outfit saved to closet collection
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully
                  data:
                    $ref: "#/components/schemas/Outfit"
        403:
          description: "Permission denied: Users do not share active cluster with WARDROBE enabled"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 403
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Permission denied: Users do not share active cluster with WARDROBE enabled"
                  errors:
                    type: array
                    items:
                      type: string
