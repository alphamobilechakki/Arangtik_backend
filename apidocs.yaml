                  description: "Garment input photo (JPG, PNG, WebP up to 15MB)"
                target_garment:
                  type: string
                  enum: [all, upper_clothes, pants, dress, skirt]
                  default: all
                response_format:
                  type: string
                  enum: [json, image_direct]
                  default: json
      responses:
        200:
          description: Garment processed cleanly through 3D pipeline
          content:
            "application/json":
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      executionTimeMs:
                        type: number
                        example: 48580
                      processingTimeSec:
                        type: number
                        example: 48.58
                      totalGarments:
                        type: integer
                        example: 1
                      garments:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              example: upper_clothes
                            mappedDbCategory:
                              type: string
                              example: UPPER_WEAR
                            title:
                              type: string
                              example: "White Real Madrid Football Jersey"
                            url:
                              type: string
                              example: "https://bg.arangtik.com/api/outputs/73ed5a1135_garment_001.png"
                            resolution:
                              type: string
                              example: "1024x1024"
