components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard authenticated customer session token
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (Admin)
      description: "Administrative portal access token (requires role: admin)"
    ApiKeyAuth:
      type: apiKey
      in: header
      name: "x-api-key"
      description: Shared secret key for IoT hardware and integration services
  schemas:
    Pagination:
      type: object
      properties:
        totalItems:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3
        currentPage:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      properties:
