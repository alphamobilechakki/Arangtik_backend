  "/admin/terminal/logs":
    get:
      tags:
        - "Admin Live Terminal"
      summary: "Get Real-Time In-Memory Logs & BullMQ Queue Stats"
      description: "Returns in-memory ring-buffered developer logs and live Redis BullMQ queue telemetry without hitting MongoDB or disk."
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
          description: "Max number of recent logs to return (up to 1000)"
        - name: level
          in: query
          schema:
            type: string
            enum: [ALL, INFO, WARN, ERROR, SUCCESS, AI]
            default: ALL
          description: "Filter by log severity level"
      responses:
        200:
          description: Logs retrieved successfully
          content:
            "application/json":
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logs retrieved successfully"
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            timestamp:
                              type: string
                            level:
                              type: string
                            module:
                              type: string
                            message:
                              type: string
                            metadata:
                              type: object
                      totalInMemory:
                        type: integer
                        example: 2
                      bufferCapacity:
                        type: integer
                        example: 1000
                      queueStats:
                        type: object
                        properties:
                          isRedisConnected:
                            type: boolean
                          waiting:
                            type: integer
                          active:
                            type: integer
                          completed:
                            type: integer
                          failed:
                            type: integer
                          delayed:
                            type: integer
                      serverTime:
                        type: string
