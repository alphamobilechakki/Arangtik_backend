components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard authenticated customer session token
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (Admin)
      description: "Administrative portal access token (requires role: admin)"
    ApiKeyAuth:
      type: apiKey
      in: header
      name: "x-api-key"
      description: Shared secret key for IoT hardware and integration services
  schemas:
    Pagination:
      type: object
      properties:
        totalItems:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3
        currentPage:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        hasNextPage:
          type: boolean
          example: true
        hasPrevPage:
          type: boolean
          example: false
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      properties:
        _id:
          type: string
          example: 6ac0952c80239788e764c0f9
        name:
          type: string
          example: Priya Sharma
        phone:
          type: string
          example: "919876543210"
        email:
          type: string
          example: "priya@example.com"
        role:
          type: string
          example: user
        profileImage:
          type: string
          example: "https://api.arangtik.com/uploads/priya.jpg"
        createdAt:
          type: string
          format: "date-time"
    WardrobeContainer:
      type: object
      properties:
        _id:
          type: string
          example: 6ae0551433480f1d0fb8d9e2
        userId:
          type: string
          example: 6ac0952c80239788e764c0f9
        name:
          type: string
          example: Daily Casuals
        type:
          type: string
          example: PERSONAL
        ownerName:
          type: string
          example: Monika
        isDefault:
          type: boolean
          example: true
        itemCount:
          type: integer
          example: 18
        coverImage:
          type: string
          example: "https://api.arangtik.com/uploads/cover.jpg"
        ownerFaceImage:
          type: string
          example: "https://api.arangtik.com/uploads/face.jpg"
        isActive:
          type: boolean
          example: true
    WardrobeItem:
      type: object
      properties:
        _id:
          type: string
          example: 6ae0601433480f1d0fb8d9f1
        userId:
          type: string
          example: 6ac0952c80239788e764c0f9
        wardrobeId:
          type: string
          example: 6ae0551433480f1d0fb8d9e2
        name:
          type: string
          example: Navy Blue Silk Kurta
        category:
          type: string
          example: Kurtas
        subCategory:
          type: string
          example: Silk
        color:
          type: string
          example: Navy Blue
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
        isFavorite:
          type: boolean
          example: false
        wearCount:
          type: integer
          example: 3
        lastModifiedBy:
          type: string
          example: 6ac0952c80239788e764c0f9
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              type:
                type: string
                example: SEGMENTED
              isPrimary:
                type: boolean
                example: true
    SuggestedOutfit:
      type: object
      properties:
        title:
          type: string
          example: Breezy Casual Look
        occasion:
          type: string
          example: CASUAL
        season:
          type: string
          example: SUMMER
        matchScore:
          type: number
          example: 95
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
              slot:
                type: string
                example: UPPER_WEAR
              name:
                type: string
                example: Linen Shirt
    Outfit:
      type: object
      properties:
        _id:
          type: string
          example: 673b01234ba477c7d42cfa11
        userId:
          type: string
          example: 6735fa016ba477c7d42cfb82
        targetUserId:
          type: string
          example: 6735fa016ba477c7d42cfb82
        createdBy:
          type: string
          example: 6735fa016ba477c7d42cfb81
        clusterId:
          type: string
          example: 6735fa016ba477c7d42cfb80
        title:
          type: string
          example: Friday Office Casual
        occasion:
          type: string
          example: CASUAL
